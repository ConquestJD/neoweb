<footer class="site-footer">
  <div class="site-footer-inner">

    <div class="site-footer-top">
      <a routerLink="/contacto" class="site-footer-cta">Iniciemos tu proyecto</a>
      <div class="site-footer-contact">
        <a *ngFor="let link of contactLinks"
           [href]="link.url"
           class="site-footer-contact-link"
           [attr.target]="link.url.startsWith('mailto:') ? null : '_blank'"
           [attr.rel]="link.url.startsWith('mailto:') ? null : 'noopener noreferrer'">
          {{ link.label }}
        </a>
      </div>
    </div>

    <nav class="site-footer-nav" aria-label="Navegación del sitio">
      <a *ngFor="let link of navLinks"
         [routerLink]="link.route"
         class="site-footer-nav-item">
        <span class="site-footer-nav-index">{{ link.index }}</span>
        <span class="site-footer-nav-label">{{ link.label }}</span>
        <span class="material-icons site-footer-nav-arrow" aria-hidden="true">arrow_outward</span>
      </a>
    </nav>

    <div class="site-footer-services">
      <p class="site-footer-eyebrow">Servicios</p>
      <ul class="site-footer-services-list">
        <li *ngFor="let service of serviceLinks">
          <a [routerLink]="service.route" class="site-footer-service-link">
            <span>{{ service.label }}</span>
            <span class="material-icons site-footer-service-arrow" aria-hidden="true">arrow_outward</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="site-footer-wordmark-wrap">
      <p class="site-footer-wordmark" aria-hidden="true">NEOWEB</p>
    </div>

    <div class="site-footer-meta">
      <p class="site-footer-copy">&copy; {{ currentYear }} NeoWeb · Lima, Perú</p>
      <div class="site-footer-legal">
        <a href="/politica-privacidad" class="site-footer-legal-link">Política de Privacidad</a>
        <a href="/terminos-condiciones" class="site-footer-legal-link">Términos y Condiciones</a>
      </div>
    </div>
  </div>
</footer>
